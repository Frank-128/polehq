services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polehq
      POSTGRES_PASSWORD: polehq
      POSTGRES_DB: polehq
    ports:
      - "5433:5432"
    volumes:
      - polehq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polehq -d polehq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://polehq:polehq@postgres:5432/polehq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

volumes:
  polehq_postgres_data:
